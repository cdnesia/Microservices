# service-auth SAJA — mariadb (10.6) sekarang di compose TERPISAH (../mariadb/docker-compose.yml)
# supaya restart/rebuild service-auth (mis. lewat restart.sh setelah ada perubahan kode) TIDAK
# ikut me-restart database. Sebelumnya sempat dibundle di compose ini sendiri, lalu dipisah —
# lihat git history & CLAUDE.md bagian "Migrasi mariadb ke compose terpisah" kalau butuh
# konteks/riwayat lengkapnya.
#
# TIDAK ADA `depends_on` ke mariadb lagi (dua compose project terpisah, Docker Compose tidak
# bisa depends_on lintas project) — pastikan `../mariadb/` sudah `docker compose up -d` dan
# healthy DULU sebelum start service-auth ini, kalau tidak connect pertama akan gagal (app
# tidak auto-retry infinite, cek src/db/pool.js kalau perlu tambah retry logic nanti).
#
# DB_HOST default "mariadb-server" (container_name di ../mariadb/docker-compose.yml,
# resolvable lewat gateway-net yang sama walau beda compose project) — TIDAK perlu IP/WireGuard
# apa pun. Database eksternal kampus (SIADE/SIMAKU/PAYMENT) yang dipakai 6 service bisnis lain
# TETAP eksternal seperti biasa, tidak terpengaruh perubahan ini — lihat CLAUDE.md tabel
# "Service bisnis baru".
#
# Jalankan: cp .env.example .env (isi JWT_SECRET + DB_USER/DB_PASSWORD — HARUS SAMA PERSIS
# dengan yang diisi di ../mariadb/.env, DB_HOST/DB_NAME biarkan default), lalu
# docker compose up -d --build (dari folder ini). Jalankan SETELAH ../mariadb/ up & healthy,
# SEBELUM traefik/docker-compose.yml supaya service-auth sudah siap saat traefik mulai forward
# request.

name: gateway

networks:
  gateway-net:
    external: true

services:
  service-auth:
    build: .
    container_name: gateway-service-auth
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-mariadb-server}:${DB_PORT:-3306}/${DB_NAME:-gateway_auth}
      PORT: 4000
      DB_POOL_SIZE: ${AUTH_DB_POOL_SIZE:-20}
    networks:
      - gateway-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${AUTH_SERVICE_MEM_LIMIT:-512m}
    cpus: ${AUTH_SERVICE_CPUS:-1.0}
