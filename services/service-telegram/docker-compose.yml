# Compose file milik service-telegram sendiri — bisa dijalankan/di-deploy terpisah dari
# gateway (traefik di docker-compose.yml root, mariadb+auth-service di
# auth-service/docker-compose.yml). Network `gateway-net` harus sudah dibuat manual (nama-nya
# dipin literal supaya bisa dirujuk di sini).
#
# Service ini TIDAK butuh database sama sekali — murni proxy ke Telegram Bot API.
#
# Jalankan: docker compose up -d --build   (dari folder ini, SETELAH auth-service jalan)

networks:
  gateway-net:
    name: gateway-net
    external: true

services:
  service-telegram:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      PORT: 5000
    networks:
      - gateway-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: ${SERVICE_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
