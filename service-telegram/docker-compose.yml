# Compose file milik service-telegram sendiri — folder top-level, sejajar dengan traefik/,
# service-auth/, mariadb/ (dulu ada di services/service-telegram/, sudah dipindah ke root
# lewat git mv supaya tiap service benar-benar berdiri sendiri, bukan lagi bernaung di bawah
# folder services/ bersama). Network `gateway-net` harus sudah dibuat manual (nama-nya dipin
# literal supaya bisa dirujuk di sini).
#
# Service ini TIDAK butuh database sama sekali — murni proxy ke Telegram Bot API.
#
# Jalankan: docker compose up -d --build   (dari folder ini, SETELAH service-auth jalan)

networks:
  gateway-net:
    name: gateway-net
    external: true

services:
  service-telegram:
    build: .
    container_name: service-telegram
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      PORT: 5000
    networks:
      - gateway-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${SERVICE_MEM_LIMIT:-256m}
    cpus: ${SERVICE_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
