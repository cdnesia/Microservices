http:
  middlewares:
    # Lapis 0: tolak siapa pun yang connect LANGSUNG ke origin ini tanpa lewat Cloudflare
    # (bypass Cloudflare = bypass WAF/DDoS-protection/cache mereka juga). sourceRange dicek
    # terhadap IP TCP peer yang sesungguhnya (bukan header, tidak bisa dipalsukan) karena
    # middleware ini tidak set ipStrategy khusus. 127.0.0.1/::1 sengaja diizinkan supaya
    # curl/newman langsung ke localhost dari mesin yang sama (dev/testing) tetap jalan — di
    # Linux native, docker-proxy meneruskan IP loopback apa adanya, jadi dua baris itu cukup.
    cloudflare-ips:
      ipAllowList:
        sourceRange:
          - "173.245.48.0/20"
          - "103.21.244.0/22"
          - "103.22.200.0/22"
          - "103.31.4.0/22"
          - "141.101.64.0/18"
          - "108.162.192.0/18"
          - "190.93.240.0/20"
          - "188.114.96.0/20"
          - "197.234.240.0/22"
          - "198.41.128.0/17"
          - "162.158.0.0/15"
          - "104.16.0.0/13"
          - "104.24.0.0/14"
          - "172.64.0.0/13"
          - "131.0.72.0/22"
          - "2400:cb00::/32"
          - "2606:4700::/32"
          - "2803:f800::/32"
          - "2405:b500::/32"
          - "2405:8100::/32"
          - "2a06:98c0::/29"
          - "2c0f:f248::/32"
          - "127.0.0.1/32"
          - "::1/128"
          # ┌─ DEV-ONLY — HAPUS BARIS INI SEBELUM DEPLOY KE VPS (lihat checklist di CLAUDE.md
          # │  bagian "TLS / SSL (Cloudflare)" -> "Checklist pindah ke VPS") ─────────────────
          # │ Docker Desktop (Mac/Windows) TIDAK meneruskan 127.0.0.1 asli dari host ke
          # │ container — traffic host->published-port terlihat datang dari gateway subnet
          # │ docker-nya sendiri, BUKAN dari 127.0.0.1. Nilainya ikut subnet network
          # │ `gateway-net` di mesin masing-masing (cek: `docker network inspect gateway-net`,
          # │ lihat field IPAM.Config.Subnet) — di mesin dev ini ternyata 172.18.0.0/16 (BUKAN
          # │ 192.168.65.0/24 seperti catatan lama, subnet bisa beda tiap kali network dibuat
          # │ ulang). PENTING: file ini di-parse Traefik file provider sebagai Go template,
          # │ JANGAN taruh literal tanda kurung-kurawal-ganda di komentar mana pun di file
          # │ ini — akan bikin seluruh dynamic config gagal load (pernah kejadian di sesi ini).
          # │ Tanpa baris subnet ini, curl/newman langsung ke
          # │ localhost:8443 dari Mac ini akan ke-block (403) meski secara logis "dari
          # │ localhost". Di VPS (Docker Engine native, bukan Docker Desktop) baris ini TIDAK
          # │ dibutuhkan sama sekali — 127.0.0.1/::1 di atas sudah cukup.
          - "172.18.0.0/16"
          # └────────────────────────────────────────────────────────────────────────────────

    # Lapis 1: proteksi kasar per-IP, jalan SEBELUM auth supaya request yang belum
    # punya identitas (belum lewat forwardAuth) tidak bisa membanjiri service-auth.
    # Limitnya sengaja longgar — bukan kuota per-tenant, cuma anti-flood dasar.
    # ipStrategy.depth: 1 = ambil IP client asli dari X-Forwarded-For (posisi terakhir dari
    # kanan) yang sudah dipercaya lewat forwardedHeaders.trustedIPs di traefik.yml — tanpa ini,
    # semua visitor lewat Cloudflare akan kebaca satu IP edge yang sama dan saling berbagi kuota.
    rate-limit-ip:
      rateLimit:
        average: 50
        burst: 100
        sourceCriterion:
          ipStrategy:
            depth: 1

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: "no-referrer"
        customResponseHeaders:
          X-Powered-By: ""

    # Memanggil service-auth untuk validasi JWT + scope-check dalam satu hop.
    # Traefik otomatis mengirim header X-Forwarded-Method / X-Forwarded-Uri
    # dan meneruskan Authorization header ke service-auth. Response header
    # X-Client-Id dari service-auth diteruskan ke request berikutnya di chain ini
    # (dipakai oleh rate-limit-client di bawah) dan ke backend service.
    auth-scope:
      forwardAuth:
        address: "http://service-auth:4000/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Client-Id"
          - "X-Auth-Scopes"

    # Lapis 2: kuota per-client sesungguhnya. Jalan SETELAH auth-scope supaya
    # X-Client-Id sudah tersedia — jadi klien di belakang IP/NAT yang sama tidak
    # saling menghabiskan kuota, dan satu client tidak bisa menghabiskan kuota
    # client lain hanya dengan berbagi IP.
    rate-limit-client:
      rateLimit:
        average: 20
        burst: 40
        sourceCriterion:
          requestHeaderName: "X-Client-Id"

    # "/api/v1" (bukan cuma "/api") supaya backend tetap terima path yang sama seperti
    # sebelumnya (mis. "/ruangan/list") tanpa perlu ubah kode service manapun.
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api/v1"

    # CORS untuk service-simawa SAJA — satu-satunya service yang diakses langsung dari
    # browser (React SPA), 7 service bisnis lain tetap server-to-server (client_credentials,
    # tidak butuh CORS). accessControlAllowCredentials sengaja false — token (X-Student-Token)
    # dikirim lewat header custom, bukan cookie, jadi CORS credentials mode tidak relevan.
    cors-simawa:
      headers:
        accessControlAllowOriginList:
          - "https://simawa.umjambi.ac.id"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Student-Token"
        accessControlAllowCredentials: false
        accessControlMaxAge: 86400
        addVaryHeader: true

    # Rate-limit KHUSUS /simawa/auth/login — lebih ketat dari rate-limit-ip biasa (50 avg/100
    # burst). service-simawa tidak pakai auth-scope/client_id (lihat simawa-chain di bawah),
    # jadi login adalah satu-satunya endpoint tanpa lapis auth apa pun sebelum requireStudent —
    # rawan brute-force password mahasiswa kalau dibiarkan selonggar rate-limit-ip.
    rate-limit-login:
      rateLimit:
        average: 5
        burst: 10
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Proteksi dashboard Traefik (router terpisah di routers.yml, Host-based di subdomain
    # sendiri supaya tidak bentrok dengan PathPrefix(/api/*) punya service bisnis). Password
    # di-generate random sekali, di-hash MD5/apr1 (`htpasswd -nbm`) — SENGAJA bukan bcrypt
    # (`-B`): htpasswd di macOS generate bcrypt dengan prefix `$2y$` yang tidak selalu
    # dikenali implementasi Go-nya Traefik, apr1 lebih universal didukung. Plaintext password
    # cuma ditampilkan sekali ke operator, tidak disimpan di sini.
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$apr1$6AtMgllb$5dcXagcOk.V.kJtVvklX0/"

    # Urutan wajib: cloudflare-ips -> rate-limit-ip -> secure-headers -> auth+scope -> rate-limit-client -> strip prefix
    gateway-chain:
      chain:
        middlewares:
          - cloudflare-ips
          - rate-limit-ip
          - secure-headers
          - auth-scope
          - rate-limit-client
          - strip-api-prefix

    # service-simawa TIDAK lewat auth-scope/rate-limit-client — konsumennya React SPA publik
    # (public client OAuth2, tidak bisa aman menyimpan client_secret di browser), jadi tidak
    # pakai model client_credentials sama sekali. Satu-satunya lapis auth adalah login
    # mahasiswa (JWT X-Student-Token, dicek per-route oleh requireStudent di service-simawa
    # sendiri — lihat src/middleware/requireStudent.js). cors-simawa WAJIB sebelum posisi
    # auth-scope biasanya berada, supaya preflight OPTIONS (browser tidak kirim header auth
    # apa pun saat preflight) langsung dijawab Traefik, bukan diteruskan ke backend.
    simawa-chain:
      chain:
        middlewares:
          - cloudflare-ips
          - rate-limit-ip
          - secure-headers
          - cors-simawa
          - strip-api-prefix

    # Sama seperti simawa-chain, tapi rate-limit-login menggantikan rate-limit-ip untuk
    # endpoint /simawa/auth/login secara spesifik (lihat rate-limit-login di atas).
    simawa-login-chain:
      chain:
        middlewares:
          - cloudflare-ips
          - rate-limit-login
          - secure-headers
          - cors-simawa
          - strip-api-prefix

    # Rewrite "/api/v1/<service>/health" -> "/health" supaya backend tetap terima path polos
    # yang sama seperti healthcheck internal Docker-nya, tanpa perlu ubah kode service manapun.
    health-rewrite:
      replacePathRegex:
        regex: "^/api/v1/[a-z0-9-]+/health$"
        replacement: "/health"

    # Chain khusus health check PUBLIK — sengaja TANPA auth-scope (harus bisa diakses tanpa
    # token untuk dipakai monitoring eksternal/uptime checker) dan TANPA rate-limit-client
    # (tidak ada X-Client-Id tanpa auth). Tetap dilindungi cloudflare-ips + rate-limit-ip +
    # secure-headers — pola sama seperti /oauth/token yang juga publik tanpa token.
    health-chain:
      chain:
        middlewares:
          - cloudflare-ips
          - rate-limit-ip
          - secure-headers
          - health-rewrite
