http:
  routers:
    # Dashboard Traefik — Host-based di subdomain sendiri (BUKAN path di domain utama) supaya
    # tidak bentrok dengan PathPrefix(/api/*) punya service bisnis di bawah. Butuh DNS A record
    # untuk subdomain ini di Cloudflare (proxied) menunjuk ke IP VPS yang sama.
    #
    # SENGAJA "traefik.umjambi.ac.id" (satu level, sejajar dengan "production"), BUKAN
    # "traefik.production.umjambi.ac.id" (dua level) — wildcard cert *.umjambi.ac.id cuma
    # mencakup satu level subdomain (aturan TLS SNI standar), jadi dua-level akan selalu
    # cert-mismatch walau cert-nya wildcard. Kalau nanti mau tetap pakai bentuk
    # "traefik.production.umjambi.ac.id", generate Origin Certificate baru yang eksplisit
    # mencakup "*.production.umjambi.ac.id".
    traefik-dashboard:
      rule: "Host(`traefik.umjambi.ac.id`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - cloudflare-ips
        - dashboard-auth
      service: api@internal

    # Endpoint publik untuk menerbitkan token (client_credentials).
    # Tidak lewat auth-scope middleware karena memang belum ada token di titik ini.
    auth-token:
      rule: "PathPrefix(`/oauth`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - cloudflare-ips
        - rate-limit-ip
        - secure-headers
      service: service-auth

    # Semua request ke service bisnis wajib lewat gateway-chain (rate-limit, headers,
    # auth+scope). Tiap router scoped ke prefix-nya sendiri di bawah /api/v1/* — supaya tiap
    # router eksplisit menangani prefix-nya sendiri, tidak mengandalkan urutan prioritas
    # implisit Traefik (yang sebenarnya tetap benar otomatis lewat rule-specificity, tapi
    # eksplisit lebih jelas dibaca). "v1" SENGAJA tidak dipakai untuk /oauth/* (auth-token di
    # atas) — service-auth adalah control plane terpisah, bukan bagian dari versioning API
    # bisnis ini.
    # Health check PUBLIK per service, TANPA token — dipakai monitoring eksternal/uptime
    # checker. "Path" exact match lebih spesifik daripada "PathPrefix" milik router bisnis di
    # bawah, jadi otomatis diprioritaskan Traefik (rule-specificity), tanpa perlu "priority:"
    # eksplisit. Lihat health-chain & health-rewrite di middlewares.yml.
    service-ruangan-health:
      rule: "Path(`/api/v1/ruangan/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-ruangan

    service-pegawai-health:
      rule: "Path(`/api/v1/pegawai/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-pegawai

    service-bipot-health:
      rule: "Path(`/api/v1/bipot/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-bipot

    service-jadwal-health:
      rule: "Path(`/api/v1/jadwal/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-jadwal

    service-khs-health:
      rule: "Path(`/api/v1/khs/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-khs

    service-tagihan-health:
      rule: "Path(`/api/v1/tagihan/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-tagihan

    service-telegram-health:
      rule: "Path(`/api/v1/telegram/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-telegram

    service-simawa-health:
      rule: "Path(`/api/v1/simawa/health`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - health-chain
      service: service-simawa

    service-ruangan:
      rule: "PathPrefix(`/api/v1/ruangan`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-ruangan

    service-pegawai:
      rule: "PathPrefix(`/api/v1/pegawai`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-pegawai

    service-bipot:
      rule: "PathPrefix(`/api/v1/bipot`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-bipot

    service-jadwal:
      rule: "PathPrefix(`/api/v1/jadwal`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-jadwal

    service-khs:
      rule: "PathPrefix(`/api/v1/khs`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-khs

    service-tagihan:
      rule: "PathPrefix(`/api/v1/tagihan`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-tagihan

    service-telegram:
      rule: "PathPrefix(`/api/v1/telegram`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-telegram

    service-simawa:
      rule: "PathPrefix(`/api/v1/simawa`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - gateway-chain
      service: service-simawa

  services:
    service-auth:
      loadBalancer:
        servers:
          - url: "http://service-auth:4000"

    service-ruangan:
      loadBalancer:
        servers:
          - url: "http://service-ruangan:5000"

    service-pegawai:
      loadBalancer:
        servers:
          - url: "http://service-pegawai:5000"

    service-bipot:
      loadBalancer:
        servers:
          - url: "http://service-bipot:5000"

    service-jadwal:
      loadBalancer:
        servers:
          - url: "http://service-jadwal:5000"

    service-khs:
      loadBalancer:
        servers:
          - url: "http://service-khs:5000"

    service-tagihan:
      loadBalancer:
        servers:
          - url: "http://service-tagihan:5000"

    service-telegram:
      loadBalancer:
        servers:
          - url: "http://service-telegram:5000"

    service-simawa:
      loadBalancer:
        servers:
          - url: "http://service-simawa:5000"
