entryPoints:
  # HTTP murni cuma dipakai buat redirect paksa ke websecure (443) — tidak ada router yang
  # match di sini, redirection ini jalan di level entrypoint jadi berlaku untuk semua request
  # sebelum routing rule dievaluasi. Ini yang bikin Cloudflare "Full (strict)" jalan: kalau
  # ada request http:// yang lolos sampai origin (mis. dari luar Cloudflare), tetap dipaksa ke
  # https:// alih-alih diteruskan plain-text ke service bisnis.
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      trustedIPs: &cloudflareIPs
        # Cloudflare edge IP ranges (https://www.cloudflare.com/ips/) — dipercaya untuk
        # X-Forwarded-For/X-Forwarded-Proto supaya IP client asli (bukan IP edge Cloudflare)
        # yang dipakai di access log & rate-limit-ip. Verifikasi ulang berkala, jarang
        # berubah tapi bisa saja Cloudflare update daftarnya.
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
  # TLS entrypoint publik — sertifikat di-load dari traefik/dynamic/tls.yml (Cloudflare
  # Origin CA certificate, lihat CLAUDE.md bagian "TLS / SSL (Cloudflare)").
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: *cloudflareIPs

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true # dev/demo only — jangan pakai di production tanpa auth di depan dashboard

log:
  level: INFO

accessLog:
  format: json
