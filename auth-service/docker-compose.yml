# auth-service HANYA berisi container auth-service — TIDAK LAGI bundle container mariadb
# sendiri. Database-nya sekarang instance MariaDB yang sudah ada & dikelola terpisah di VPS
# (/opt/mariadb-server/docker-compose.yml di host "biznet", bukan bagian dari project ini),
# yang juga dipakai untuk hal lain (mis. replika sql_siade_umjambi_ac_id/sql_payment_*).
# auth-service tetap satu-satunya PEMILIK SKEMA di database itu (tabel clients, scopes,
# refresh_tokens) — lihat auth-service/db/init.sql untuk schema-nya, dan jalankan isinya
# manual sekali di instance itu (lihat instruksi di CLAUDE.md bagian "Database Eksternal
# (MariaDB Bersama)") karena init.sql TIDAK LAGI auto-run oleh docker-entrypoint-initdb.d
# (itu cuma berlaku untuk image mariadb official saat data directory-nya kosong).
#
# Koneksi ke database lewat IP routable (DB_HOST, lihat .env.example — mis. alamat WireGuard
# host), BUKAN lewat nama container Docker — jadi auth-service TIDAK perlu join network
# Docker khusus milik compose /opt/mariadb-server, cukup `gateway-net` saja. Ini cuma jalan
# kalau host Docker yang menjalankan auth-service ini sendiri bisa route ke DB_HOST itu
# (mis. dia punya interface WireGuard yang sama) — kalau auth-service pindah ke host lain,
# pastikan host itu juga punya akses network yang sama sebelum connect.
#
# Jalankan: cp .env.example .env (isi JWT_SECRET + DB_HOST/DB_USER/DB_PASSWORD/DB_NAME sesuai
# kredensial yang sudah dibuat di instance mariadb eksternal), lalu docker compose up -d --build
# (dari folder ini). Jalankan SEBELUM traefik/docker-compose.yml supaya auth-service sudah
# siap saat traefik mulai forward request — walau traefik sendiri tetap retry per request
# kalau backend belum up.

name: gateway

networks:
  gateway-net:
    external: true

services:
  auth-service:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-3306}/${DB_NAME}
      PORT: 4000
      # Budget koneksi: DB_POOL_SIZE di sini + total connectionLimit semua consumer lain yang
      # nempel ke instance mariadb eksternal yang SAMA harus punya headroom di bawah
      # max_connections instance itu (default 500, lihat /opt/mariadb-server/docker-compose.yml
      # di VPS) — biarkan headroom, jangan pas-pasan. Lihat CLAUDE.md bagian "Kapasitas
      # Database".
      DB_POOL_SIZE: ${AUTH_DB_POOL_SIZE:-20}
    networks:
      - gateway-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${AUTH_SERVICE_MEM_LIMIT:-512m}
    cpus: ${AUTH_SERVICE_CPUS:-1.0}
