# auth-service + mariadb (10.6) sendiri, dibundle di compose ini — bukan lagi connect ke
# instance MariaDB eksternal (/opt/mariadb-server di VPS "biznet", lihat git history untuk
# bentuk sebelumnya). Dikembalikan ke pola bundled supaya auth-service tidak bergantung pada
# konektivitas WireGuard ke instance eksternal itu — data auth-service (clients, scopes,
# refresh_tokens) memang cuma dipakai auth-service sendiri, tidak ada consumer lain yang perlu
# akses langsung ke database ini, jadi tidak ada alasan kuat untuk taruh di instance bersama.
#
# init.sql (auth-service/db/init.sql) AUTO-RUN lewat docker-entrypoint-initdb.d — cuma
# berlaku sekali saat volume `mariadb_data` masih kosong (first run). Kalau schema berubah
# setelah itu, jalankan migrasi manual, bukan andalkan auto-run ini lagi.
#
# DB_HOST default "mariadb" (nama service ini, resolvable lewat gateway-net) — TIDAK perlu
# IP/WireGuard apa pun lagi untuk auth-service. Database eksternal kampus (SIADE/SIMAKU/
# PAYMENT) yang dipakai 6 service bisnis lain TETAP eksternal seperti biasa, tidak terpengaruh
# perubahan ini — lihat CLAUDE.md tabel "Service bisnis baru".
#
# Jalankan: cp .env.example .env (isi JWT_SECRET + DB_USER/DB_PASSWORD, DB_HOST/DB_NAME biarkan
# default), lalu docker compose up -d --build (dari folder ini). Jalankan SEBELUM
# traefik/docker-compose.yml supaya auth-service sudah siap saat traefik mulai forward request.

name: gateway

networks:
  gateway-net:
    external: true

volumes:
  mariadb_data:

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb-server
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes" # app tidak pernah pakai root sama sekali
      MARIADB_DATABASE: ${DB_NAME:-gateway_auth}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-flush-log-at-trx-commit=2 # trade throughput vs durability, cukup untuk data control-plane ini
      - --wait-timeout=180 # reclaim koneksi idle lebih cepat dari default 8 jam
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gateway-net
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build: .
    container_name: gateway-auth-service
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-mariadb}:${DB_PORT:-3306}/${DB_NAME:-gateway_auth}
      PORT: 4000
      DB_POOL_SIZE: ${AUTH_DB_POOL_SIZE:-20}
    networks:
      - gateway-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${AUTH_SERVICE_MEM_LIMIT:-512m}
    cpus: ${AUTH_SERVICE_CPUS:-1.0}
